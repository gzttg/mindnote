<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#F8FAFD">
  <title>MindNote — 極簡純白 ADHD 筆記本</title>
  <meta name="description" content="專為快速寫入、課業學術、生活備忘與 ADHD 行動節奏打造的極簡純白高呼吸感筆記系統。" />
  <meta property="og:title" content="MindNote — 極簡純白 ADHD 筆記本" />
  <meta property="og:description" content="專為快速寫入、課業學術、生活備忘與 ADHD 行動節奏打造的極簡純白高呼吸感筆記系統。" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Fonts: English → Google Sans Flex / Roboto；中文 → Noto Sans TC / SC（現代無襯線黑體） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap">

  <style>
    /* =========================================================
       Design Tokens — Material 3 Expressive inspired
       ========================================================= */
    :root {
      --font: "Google Sans Flex", "Google Sans", "Product Sans", "Roboto",
              "Noto Sans TC", "Noto Sans SC", "PingFang TC", "PingFang SC",
              "Microsoft JhengHei", "Microsoft YaHei", sans-serif;

      --primary: #0B57D0;
      --primary-hover: #0842A0;
      --on-primary: #FFFFFF;
      --primary-container: #D3E3FD;
      --on-primary-container: #041E49;

      --surface: #F8FAFD;
      --surface-dim: #F0F4F9;
      --surface-container: #E9EEF6;
      --surface-high: #DDE3EA;
      --surface-card: #FFFFFF;
      --on-surface: #1F1F1F;
      --on-surface-variant: #444746;
      --muted: #747775;
      --outline: #C4C7C5;
      --outline-soft: #E3E8EF;

      /* Two Domain Categories: Academic (Crimson Laser) & Memo/Life (Glacier Cyan Laser) */
      --academic: #E11D48; --academic-strong: #BE123C; --academic-bg: #FFF1F2; --academic-border: #FECDD3; --academic-glow: rgba(225, 29, 72, .45);
      --memo:     #0EA5E9; --memo-strong:     #0369A1; --memo-bg:     #F0F9FF; --memo-border:     #BAE6FD; --memo-glow:     rgba(56, 189, 248, .55);
      --green:    #16A34A; --green-strong:    #15803D; --green-bg:    #ECFDF5; --green-border:    #BBF7D0;
      --reason:   #9334E6; --reason-strong:   #7627BB; --reason-bg:   #F5F0FF; --reason-border:   #E2D2FA;
      --amber:    #F59E0B; --amber-strong:    #B45309; --amber-bg:    #FFFBEB; --amber-border:    #FDE68A;

      --gemini: linear-gradient(90deg, #4285F4 0%, #9B72CB 55%, #38BDF8 100%);

      --ease: cubic-bezier(0.2, 0, 0, 1);
      --ease-out: cubic-bezier(0.05, 0.7, 0.1, 1);
      --spring: cubic-bezier(0.34, 1.45, 0.64, 1);

      --r-sm: 12px; --r-md: 16px; --r-lg: 22px; --r-xl: 26px; --r-full: 9999px;

      --shadow-1: 0 1px 2px rgba(15,23,42,.04), 0 2px 8px rgba(15,23,42,.03);
      --shadow-2: 0 4px 16px rgba(15,23,42,.07), 0 1px 3px rgba(15,23,42,.05);
      --shadow-3: 0 16px 40px rgba(15,23,42,.14);
    }

    .cat-academic { --c: var(--academic); --c-strong: var(--academic-strong); --c-bg: var(--academic-bg); --c-border: var(--academic-border); --c-glow: var(--academic-glow); }
    .cat-memo     { --c: var(--memo);     --c-strong: var(--memo-strong);     --c-bg: var(--memo-bg);     --c-border: var(--memo-border);     --c-glow: var(--memo-glow); }
    .cat-auto     { --c: #9B72CB;         --c-strong: #5B3E96;                --c-bg: #F3EEFC;            --c-border: #DDD0F6;                --c-glow: rgba(155, 114, 203, .45); }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    html { font-size: 14px; }
    body {
      background: var(--surface);
      color: var(--on-surface);
      font-family: var(--font);
      letter-spacing: .01em;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }
    button, input, textarea, select { font-family: inherit; color: inherit; }
    button { cursor: pointer; }
    svg { flex-shrink: 0; }

    .row { display: flex; align-items: center; }
    .gap4 { gap: 4px; } .gap6 { gap: 6px; } .gap8 { gap: 8px; } .gap12 { gap: 12px; }
    .wrap { flex-wrap: wrap; }
    .spacer { flex: 1; }

    /* =========================================================
       Enhanced Ripple & Press Feedback
       ========================================================= */
    .rp { position: relative; overflow: hidden; isolation: isolate; }
    .ripple-wave {
      position: absolute; border-radius: 50%;
      background: radial-gradient(circle, currentColor 0%, transparent 72%);
      opacity: .26;
      transform: scale(0); pointer-events: none; z-index: 1;
      animation: ripple .65s var(--ease-out) forwards;
    }
    @keyframes ripple {
      0% { transform: scale(0); opacity: .28; }
      100% { transform: scale(1.15); opacity: 0; }
    }

    .particle { position: fixed; width: 8px; height: 8px; border-radius: 50%; pointer-events: none; z-index: 3000; }

    /* =========================================================
       Buttons & Chrome-style Ask Gemini Pill
       ========================================================= */
    .btn {
      position: relative; overflow: hidden; isolation: isolate;
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      height: 40px; padding: 0 20px;
      border-radius: var(--r-full);
      border: 1px solid transparent;
      font-size: 14px; font-weight: 500; letter-spacing: .01em;
      white-space: nowrap; user-select: none; outline: none;
      transition: border-radius .35s var(--spring), transform .35s var(--spring),
                  background-color .2s var(--ease), box-shadow .2s var(--ease), color .2s var(--ease);
    }
    .btn:active:not(:disabled) { border-radius: 12px; transform: scale(.96); }
    .btn:focus-visible { box-shadow: 0 0 0 3px var(--primary-container); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }
    .btn.sm { height: 34px; padding: 0 14px; font-size: 12.5px; }
    .btn.xs { height: 28px; padding: 0 11px; font-size: 12px; }

    .btn-filled { background: var(--primary); color: var(--on-primary); box-shadow: var(--shadow-1); }
    .btn-filled:hover:not(:disabled) { background: var(--primary-hover); box-shadow: var(--shadow-2); }
    .btn-tonal { background: var(--primary-container); color: var(--on-primary-container); }
    .btn-tonal:hover:not(:disabled) { box-shadow: var(--shadow-1); background: #C2D7FA; }
    .btn-outlined { background: var(--surface-card); border-color: var(--outline); color: var(--primary); }
    .btn-outlined:hover:not(:disabled) { background: #F1F5FD; }
    .btn-text { background: transparent; color: var(--primary); padding: 0 12px; }
    .btn-text:hover:not(:disabled) { background: rgba(11,87,208,.08); }
    .btn-danger { background: #B3261E; color: #fff; }
    .btn-danger:hover:not(:disabled) { background: #8C1D18; }
    .btn-danger-text { background: transparent; color: #B3261E; }
    .btn-danger-text:hover { background: rgba(179,38,30,.08); }
    .btn-green { background: var(--green-strong); color: #fff; }
    .btn-green:hover { background: #0D652D; }

    .btn-ai {
      background: var(--gemini); background-size: 200% 100%; color: #fff; font-weight: 600;
      box-shadow: 0 4px 14px rgba(155,114,203,.28);
      transition: background-position .6s var(--ease), border-radius .35s var(--spring), transform .35s var(--spring), box-shadow .2s;
    }
    .btn-ai:hover:not(:disabled) { background-position: 100% 0; box-shadow: 0 6px 20px rgba(155,114,203,.38); }

    /* Chrome-style subtle Ask Gemini button */
    .btn-ask-gemini {
      background: linear-gradient(135deg, #F2F6FF 0%, #F5EEFF 100%);
      border: 1px solid #D3E3FD;
      color: #0B57D0;
      font-weight: 600;
      box-shadow: 0 1px 2px rgba(11,87,208,.06);
    }
    .btn-ask-gemini:hover:not(:disabled) {
      background: linear-gradient(135deg, #E4EDFF 0%, #EDE2FF 100%);
      border-color: #A8C7FA;
      box-shadow: 0 3px 10px rgba(11,87,208,.14);
      transform: translateY(-1px);
    }
    .btn-ask-gemini svg { fill: url(#gemGradBrand); }

    .sort-select {
      height: 34px; padding: 0 12px;
      border-radius: var(--r-full);
      border: 1px solid var(--outline);
      background: var(--surface-card);
      font-size: 12.5px; font-weight: 500; color: var(--on-surface);
      outline: none; cursor: pointer;
      transition: border-color .2s, box-shadow .2s;
    }
    .sort-select:hover { border-color: var(--primary); background: #F8FAFF; }
    .sort-select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-container); }

    .icon-btn {
      position: relative; overflow: hidden; isolation: isolate;
      width: 38px; height: 38px; border-radius: var(--r-full);
      display: inline-flex; align-items: center; justify-content: center;
      background: transparent; border: none; color: var(--on-surface-variant);
      transition: background-color .2s var(--ease), transform .35s var(--spring), border-radius .35s var(--spring);
    }
    .icon-btn:hover { background: rgba(31,31,31,.07); }
    .icon-btn:active { transform: scale(.88); border-radius: 12px; }
    .icon-btn.sm { width: 30px; height: 30px; }

    /* =========================================================
       Laser-Dot Metadata, Tabular Dates & Quiet Tags
       ========================================================= */
    .cat-badge {
      display: inline-flex; align-items: center; gap: 7px;
      height: 22px; padding: 0;
      font-size: 12px; font-weight: 600; letter-spacing: .015em;
      color: var(--on-surface-variant);
      background: transparent; border: none;
      white-space: nowrap;
    }
    .cat-badge .laser-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--c);
      box-shadow: 0 0 0 2.5px rgba(15, 23, 42, 0.04), 0 0 8px var(--c-glow, var(--c));
      flex-shrink: 0;
    }

    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      height: 22px; padding: 0 2px;
      border-radius: 6px;
      font-size: 11.5px; font-weight: 600; letter-spacing: .02em;
      font-variant-numeric: tabular-nums;
      background: transparent; color: var(--on-surface-variant);
      border: none;
      white-space: nowrap;
      transition: color .2s var(--ease);
    }
    .chip .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--c);
      box-shadow: 0 0 7px var(--c-glow, var(--c));
    }
    .chip.due-over  { color: #BE123C; }
    .chip.due-today { color: #B45309; }
    .chip.due-tmr   { color: #C2410C; }
    .chip.due-later { color: #64748B; font-weight: 500; }

    .tag {
      display: inline-flex; align-items: center; height: 20px; padding: 0 2px;
      font-size: 11.5px; font-weight: 500;
      color: var(--muted); background: transparent; border: none;
      white-space: nowrap;
    }

    .fchip {
      position: relative; overflow: hidden; isolation: isolate;
      display: inline-flex; align-items: center; gap: 6px;
      height: 30px; padding: 0 12px; border-radius: var(--r-full);
      border: 1px solid rgba(15, 23, 42, .08); background: rgba(255, 255, 255, .72);
      font-size: 12px; font-weight: 500; color: var(--on-surface-variant);
      transition: all .3s var(--spring);
    }
    .fchip:hover { background: var(--surface-dim); border-color: rgba(15, 23, 42, .14); }
    .fchip:active { transform: scale(.95); }
    .fchip.selected {
      border-color: rgba(15, 23, 42, .12);
      background: rgba(255, 255, 255, .96);
      color: var(--on-surface);
      box-shadow: 0 2px 8px rgba(15, 23, 42, .06), inset 0 1px 0 #fff;
      font-weight: 600;
    }
    .fchip .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--c, var(--primary));
      box-shadow: 0 0 6px var(--c-glow, rgba(11, 87, 208, .35));
    }

    /* =========================================================
       Sidebar — Navigation rail (Plan A: 2 Domain Categories)
       ========================================================= */
    #sidebar {
      width: 256px; background: var(--surface-dim);
      padding: 20px 14px; display: flex; flex-direction: column; gap: 16px;
      flex-shrink: 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; z-index: 20;
      transition: width .4s var(--ease), padding .4s var(--ease);
    }
    #sidebar.collapsed { width: 84px; padding: 20px 12px; }
    #sidebar.collapsed .sidebar-hide { display: none !important; }
    #sidebar.collapsed .nav-item { justify-content: center; padding: 0; }
    #sidebar.collapsed .brand-row { flex-direction: column; gap: 12px; }
    #sidebar.collapsed .compose-btn { width: 56px; padding: 0; align-self: center; }

    .brand-row { display: flex; align-items: center; justify-content: space-between; padding: 0 4px; }
    .brand-logo {
      width: 40px; height: 40px; border-radius: 14px;
      background: var(--surface-card); color: var(--primary);
      display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-1);
      transition: transform .5s var(--spring), border-radius .5s var(--spring);
    }
    .brand-logo:hover { transform: rotate(-12deg) scale(1.06); border-radius: 50%; }
    .brand-logo svg { fill: url(#gemGradBrand); stroke: none; }
    .brand-name { font-size: 18px; font-weight: 700; letter-spacing: -.01em; }
    .brand-sub { font-size: 11px; color: var(--muted); }

    .compose-btn {
      height: 54px; border-radius: 18px; padding: 0 20px;
      background: var(--primary-container); color: var(--on-primary-container);
      font-size: 14px; font-weight: 600; justify-content: flex-start; gap: 12px;
      box-shadow: var(--shadow-1);
    }
    .compose-btn:hover { box-shadow: var(--shadow-2); }
    .compose-btn:active { border-radius: 28px; }

    nav.rail { position: relative; display: flex; flex-direction: column; gap: 2px; }
    .nav-indicator {
      position: absolute; top: 0; left: 0;
      height: 46px; border-radius: var(--r-full);
      background: linear-gradient(135deg, rgba(255, 255, 255, .96) 0%, rgba(232, 240, 254, .88) 100%);
      border: 1px solid rgba(255, 255, 255, .95);
      box-shadow:
        0 4px 14px rgba(15, 23, 42, .06),
        0 1px 2px rgba(11, 87, 208, .08),
        inset 0 1px 0 rgba(255, 255, 255, 1);
      pointer-events: none; z-index: 0; opacity: 0;
      transform: translate3d(0, 0, 0);
      transition:
        transform .48s cubic-bezier(0.34, 1.45, 0.64, 1),
        height .35s cubic-bezier(0.34, 1.45, 0.64, 1),
        width .35s cubic-bezier(0.34, 1.45, 0.64, 1),
        background .3s var(--ease),
        box-shadow .3s var(--ease),
        opacity .2s var(--ease);
      will-change: transform;
    }
    .nav-indicator[data-tab="academic"] {
      background: linear-gradient(135deg, rgba(255, 255, 255, .97) 0%, rgba(255, 241, 242, .92) 100%);
      box-shadow: 0 4px 14px rgba(225, 29, 72, .08), inset 0 1px 0 #fff;
    }
    .nav-indicator[data-tab="memo"] {
      background: linear-gradient(135deg, rgba(255, 255, 255, .97) 0%, rgba(240, 249, 255, .95) 100%);
      box-shadow: 0 4px 14px rgba(14, 165, 233, .10), inset 0 1px 0 #fff;
    }

    .nav-section { font-size: 11px; font-weight: 600; color: var(--muted); padding: 12px 16px 4px; letter-spacing: .06em; position: relative; z-index: 1; }
    .nav-item {
      position: relative; z-index: 1; overflow: hidden; isolation: isolate;
      width: 100%; height: 46px; padding: 0 16px;
      border-radius: var(--r-full); border: none; background: transparent;
      font-size: 14px; font-weight: 500; color: var(--on-surface-variant);
      display: flex; align-items: center; gap: 14px; text-align: left;
      transition: background-color .22s var(--ease), color .25s var(--ease), transform .3s var(--spring);
    }
    .nav-item:hover:not(.active) { background: rgba(15, 23, 42, .04); color: var(--on-surface); }
    .nav-item:active { transform: scale(.97); }
    .nav-item .nav-icon { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; color: var(--c, currentColor); }
    .nav-item.active { background: transparent; color: var(--c-strong, var(--on-primary-container)); font-weight: 600; }
    .nav-item .nav-count {
      margin-left: auto; font-size: 11.5px; font-weight: 600;
      color: var(--muted); font-variant-numeric: tabular-nums;
      transition: color .25s var(--ease);
    }
    .nav-item.active .nav-count { color: inherit; }

    .lang-pill-group {
      margin-top: auto; display: flex; gap: 4px; padding: 4px;
      background: var(--surface-card); border-radius: var(--r-full);
      border: 1px solid rgba(15, 23, 42, .06);
      box-shadow: var(--shadow-1);
    }
    .lang-pill-group button {
      flex: 1; height: 28px; border: none; border-radius: var(--r-full);
      background: transparent; font-size: 11.5px; font-weight: 600; color: var(--muted);
      transition: all .25s var(--spring);
    }
    .lang-pill-group button.active { background: var(--primary-container); color: var(--on-primary-container); }

    .slogan-card {
      padding: 14px 16px; background: var(--surface-card);
      border: 1px solid rgba(15, 23, 42, .06);
      border-radius: 18px; font-size: 12px; line-height: 1.65; color: var(--on-surface-variant);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .95), var(--shadow-1);
    }
    .slogan-head {
      display: inline-flex; align-items: center; gap: 6px;
      font-weight: 600; color: var(--green-strong); margin-bottom: 5px;
    }
    .slogan-icon {
      width: 22px; height: 22px; border-radius: 7px;
      display: inline-flex; align-items: center; justify-content: center;
      background: linear-gradient(145deg, rgba(236, 253, 245, .95), rgba(167, 243, 208, .42));
      color: #15803D;
      border: 1px solid rgba(255, 255, 255, .9);
      box-shadow: 0 2px 8px rgba(22, 163, 74, .16);
    }
    .slogan-card b { color: var(--on-surface); font-weight: 600; }

    /* =========================================================
       Main & Ambient Aura Glow Sticky Prompt Bar
       ========================================================= */
    #main-container { flex: 1; padding: 20px 34px 60px; max-width: 1360px; margin: 0 auto; width: 100%; min-width: 0; }

    .prompt-bar {
      position: sticky; top: 12px; z-index: 15;
      isolation: isolate;
      border-radius: var(--r-xl);
      margin-bottom: 24px;
    }
    /* Ambient Aura Glow positioned cleanly behind the frosted glass surface */
    .prompt-bar::after {
      content: "";
      position: absolute;
      inset: -4px 14px -10px 14px;
      z-index: -1;
      border-radius: inherit;
      background:
        radial-gradient(ellipse 46% 130% at 16% 52%, rgba(66, 133, 244, .36) 0%, transparent 72%),
        radial-gradient(ellipse 44% 130% at 50% 44%, rgba(155, 114, 203, .30) 0%, transparent 74%),
        radial-gradient(ellipse 46% 130% at 84% 54%, rgba(56, 189, 248, .34) 0%, transparent 72%);
      filter: blur(22px);
      opacity: .56;
      pointer-events: none;
      transform: scale(.985) translateY(3px);
      transition: opacity .45s var(--ease), transform .5s var(--spring);
    }
    .prompt-bar:focus-within::after {
      opacity: .92;
      transform: scale(1.015) translateY(4px);
      animation: auraBreath 4.2s ease-in-out infinite;
    }
    .prompt-bar.is-thinking::after {
      opacity: 1;
      transform: scale(1.03) translateY(4px);
      animation: auraBreath 1.8s ease-in-out infinite;
    }
    @keyframes auraBreath {
      0%, 100% { opacity: .82; transform: scale(1.005) translateY(3px); }
      50%      { opacity: 1;   transform: scale(1.035) translateY(5px); }
    }

    .prompt-bar-inner {
      position: relative; z-index: 1;
      background: rgba(255, 255, 255, .78);
      backdrop-filter: blur(20px) saturate(1.6);
      -webkit-backdrop-filter: blur(20px) saturate(1.6);
      border-radius: inherit;
      border: 1px solid rgba(255, 255, 255, .92);
      padding: 6px 8px 6px 14px;
      display: flex; align-items: center; gap: 8px;
      box-shadow:
        0 2px 12px rgba(15, 23, 42, .05),
        0 0 0 1px rgba(15, 23, 42, .06),
        inset 0 1px 0 rgba(255, 255, 255, .98);
      transition: box-shadow .35s var(--ease), background-color .3s var(--ease), border-color .3s var(--ease);
    }
    .prompt-bar-inner::before {
      content: ""; position: absolute; inset: -1px; border-radius: inherit; padding: 1px;
      background: linear-gradient(90deg, rgba(66,133,244,.85), rgba(155,114,203,.85), rgba(56,189,248,.9), rgba(66,133,244,.85));
      background-size: 300% 100%;
      -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
      -webkit-mask-composite: xor; mask-composite: exclude;
      opacity: 0; transition: opacity .35s var(--ease); pointer-events: none;
      animation: flow 5s linear infinite;
    }
    .prompt-bar:focus-within .prompt-bar-inner {
      background: rgba(255, 255, 255, .86);
      box-shadow:
        0 8px 26px rgba(66, 133, 244, .12),
        0 0 0 1px rgba(66, 133, 244, .10),
        inset 0 1px 0 #fff;
    }
    .prompt-bar:focus-within .prompt-bar-inner::before,
    .prompt-bar.is-thinking .prompt-bar-inner::before { opacity: 1; }
    .prompt-bar.is-thinking .prompt-bar-inner::before { animation-duration: 1.4s; }
    @keyframes flow { to { background-position: 300% 0; } }

    .prompt-spark {
      width: 32px; height: 32px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      background: radial-gradient(circle at 35% 28%, #1C2238 0%, #0D101C 68%, #07080F 100%);
      border: 1px solid rgba(99, 102, 241, .28);
      box-shadow: 0 2px 10px rgba(79, 70, 229, .22), inset 0 1px 0 rgba(255, 255, 255, .18);
      flex-shrink: 0;
      cursor: pointer;
      transition: transform .48s var(--spring), box-shadow .3s var(--ease);
    }
    .prompt-spark svg {
      display: block;
      transition: transform .5s var(--spring);
    }
    .prompt-spark:hover {
      box-shadow: 0 4px 16px rgba(88, 101, 255, .38), inset 0 1px 0 rgba(255, 255, 255, .26);
    }
    .prompt-spark:hover svg {
      transform: rotate(-16deg) scale(1.08);
    }
    .prompt-bar.is-thinking .prompt-spark svg { animation: spin 1.5s linear infinite; }

    .floating-input {
      flex: 1; min-width: 120px; height: 38px; border: none; outline: none;
      font-size: 14.5px; background: transparent; color: var(--on-surface);
    }
    .floating-input::placeholder { color: var(--muted); }
    .kbd {
      font-size: 11px; color: var(--muted); border: 1px solid rgba(15, 23, 42, .12);
      border-radius: 6px; padding: 0 6px; line-height: 18px;
      font-variant-numeric: tabular-nums;
      background: rgba(255, 255, 255, .6);
    }
    #quickTypeSelector { display: flex; gap: 4px; }
    #quickTypeSelector .fchip { height: 28px; padding: 0 10px; font-size: 12px; }

    /* =========================================================
       Page Headers & Precision Geometric Stat Pedestals
       ========================================================= */
    .page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
    .eyebrow { font-size: 12px; font-weight: 600; color: var(--primary); letter-spacing: .04em; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
    .display { font-size: 28px; font-weight: 700; letter-spacing: -.015em; line-height: 1.25; text-wrap: balance; font-variant-numeric: tabular-nums; }
    .display .grad { background: var(--gemini); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .page-sub { font-size: 13px; color: var(--on-surface-variant); margin-top: 4px; font-variant-numeric: tabular-nums; }

    .stat-row { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
    .stat {
      flex: 1; min-width: 145px; background: var(--surface-card);
      border-radius: 20px; padding: 14px 16px;
      border: 1px solid rgba(15, 23, 42, .07);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .96), var(--shadow-1);
      display: flex; align-items: center; gap: 13px;
      transition: transform .35s var(--spring), box-shadow .25s var(--ease), border-color .25s var(--ease);
    }
    .stat:hover {
      transform: translateY(-3px);
      border-color: rgba(15, 23, 42, .12);
      box-shadow: inset 0 1px 0 #fff, var(--shadow-2);
    }
    .stat:hover .stat-icon { transform: scale(1.06); }
    .stat-icon {
      width: 40px; height: 40px; border-radius: 13px;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(255, 255, 255, .88);
      backdrop-filter: blur(8px);
      flex-shrink: 0;
      transition: transform .38s var(--spring), box-shadow .25s var(--ease);
    }
    .stat-icon.tone-amber {
      background: linear-gradient(145deg, rgba(255, 251, 235, .96), rgba(253, 230, 138, .44));
      color: #B45309;
      box-shadow: 0 4px 14px rgba(245, 158, 11, .18), inset 0 1px 0 rgba(255, 255, 255, .95);
    }
    .stat-icon.tone-crimson {
      background: linear-gradient(145deg, rgba(255, 241, 242, .96), rgba(254, 205, 211, .48));
      color: #BE123C;
      box-shadow: 0 4px 14px rgba(225, 29, 72, .16), inset 0 1px 0 rgba(255, 255, 255, .95);
    }
    .stat-icon.tone-azure {
      background: linear-gradient(145deg, rgba(240, 249, 255, .96), rgba(186, 230, 253, .52));
      color: #0369A1;
      box-shadow: 0 4px 14px rgba(14, 165, 233, .18), inset 0 1px 0 rgba(255, 255, 255, .95);
    }
    .stat-icon.tone-emerald {
      background: linear-gradient(145deg, rgba(236, 253, 245, .96), rgba(167, 243, 208, .48));
      color: #15803D;
      box-shadow: 0 4px 14px rgba(22, 163, 74, .16), inset 0 1px 0 rgba(255, 255, 255, .95);
    }
    .stat-num {
      font-size: 22px; font-weight: 700; line-height: 1.1; letter-spacing: -.02em;
      font-variant-numeric: tabular-nums;
      transition: color .25s var(--ease), transform .35s var(--spring);
    }
    .stat-label { font-size: 12px; color: var(--on-surface-variant); margin-top: 2px; }

    .cat-hero { display: flex; align-items: center; gap: 16px; }
    .cat-hero-icon {
      width: 54px; height: 54px; border-radius: 18px;
      background: linear-gradient(145deg, rgba(255,255,255,.95), var(--c-bg));
      color: var(--c-strong);
      display: flex; align-items: center; justify-content: center;
      border: 1px solid rgba(15, 23, 42, .08);
      box-shadow: 0 6px 18px var(--c-glow), inset 0 1px 0 #fff;
      transition: border-radius .5s var(--spring), transform .5s var(--spring);
    }
    .cat-hero-icon:hover { border-radius: 50%; transform: rotate(-8deg); }

    /* =========================================================
       Priority Action Flow Panel & Gemini Suggestion Banner
       ========================================================= */
    .panel {
      background: var(--surface-card); border-radius: var(--r-xl); padding: 20px;
      border: 1px solid rgba(15, 23, 42, .07);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .96), var(--shadow-1);
      margin-bottom: 26px;
    }
    .panel-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 8px; flex-wrap: wrap; }
    .panel-title { font-size: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .section-title { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    .hint { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }

    .gemini-advice-banner {
      display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
      padding: 12px 16px; margin-bottom: 14px; border-radius: 16px;
      background: linear-gradient(135deg, rgba(240, 245, 255, .92) 0%, rgba(246, 238, 255, .9) 100%);
      border: 1px solid rgba(66, 133, 244, .22);
      animation: rise .35s var(--ease-out);
    }
    .gemini-advice-text { font-size: 13.5px; color: #1F1F1F; line-height: 1.5; flex: 1; min-width: 200px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .gemini-advice-text b { color: #0B57D0; display: inline-flex; align-items: center; gap: 5px; }

    .list { display: flex; flex-direction: column; gap: 6px; }
    .list-item {
      position: relative; overflow: hidden; isolation: isolate;
      display: flex; align-items: center; gap: 14px;
      padding: 11px 14px; border-radius: 15px;
      background: var(--surface);
      border: 1px solid rgba(15, 23, 42, .06);
      transition: background-color .2s var(--ease), transform .3s var(--spring), border-color .25s, box-shadow .25s;
    }
    .list-item:hover { background: var(--surface-dim); border-color: rgba(15, 23, 42, .11); transform: translateX(3px); box-shadow: var(--shadow-1); }
    .list-item.ai-picked {
      background: #F3F7FF; border-color: rgba(66, 133, 244, .45);
      box-shadow: 0 4px 16px rgba(66, 133, 244, .14);
    }
    .li-main { flex: 1; min-width: 0; cursor: pointer; }
    .li-title { min-width: 0; font-size: 14.5px; font-weight: 600; color: var(--on-surface); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .li-sub { font-size: 12px; color: var(--on-surface-variant); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .li-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .meta-sep { color: rgba(15, 23, 42, .22); user-select: none; font-size: 11px; }

    /* Round checkbox */
    .round-check { position: relative; width: 21px; height: 21px; flex-shrink: 0; cursor: pointer; }
    .round-check input { position: absolute; opacity: 0; inset: 0; cursor: pointer; margin: 0; }
    .round-check span {
      position: absolute; inset: 0; border-radius: 50%;
      border: 1.75px solid var(--c, var(--outline)); background: var(--surface-card);
      display: flex; align-items: center; justify-content: center;
      transition: all .35s var(--spring);
    }
    .round-check span::after {
      content: ""; width: 5px; height: 9px; border: solid #fff; border-width: 0 2px 2px 0;
      transform: rotate(45deg) scale(0); margin-top: -2px; transition: transform .35s var(--spring);
    }
    .round-check:hover span { background: var(--c-bg, var(--surface-dim)); transform: scale(1.08); }
    .round-check input:checked + span { background: var(--c, var(--primary)); border-color: var(--c, var(--primary)); }
    .round-check input:checked + span::after { transform: rotate(45deg) scale(1); }

    /* =========================================================
       Card Grid — Low-Noise Chrome Edge & Hover-Reveal Actions
       ========================================================= */
    .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(264px, 1fr)); gap: 16px; }

    .card {
      position: relative; overflow: hidden; isolation: isolate;
      background: var(--surface-card);
      border-radius: var(--r-lg);
      padding: 17px 18px 14px;
      border: 1px solid rgba(15, 23, 42, .08);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, .96),
        0 1px 2px rgba(15, 23, 42, .03),
        0 4px 14px rgba(15, 23, 42, .025);
      display: flex; flex-direction: column; gap: 10px;
      cursor: pointer; user-select: none;
      transition: transform .38s var(--spring), box-shadow .3s var(--ease), border-color .25s var(--ease), background-color .25s var(--ease);
    }
    .card:hover {
      transform: translateY(-5px);
      border-color: rgba(15, 23, 42, .15);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 1),
        0 14px 30px rgba(15, 23, 42, .09),
        0 3px 10px rgba(15, 23, 42, .04);
    }
    .card:active { transform: translateY(-1px) scale(.988); }
    .card.is-done { opacity: .58; }
    .card.is-done .card-title { text-decoration: line-through; text-decoration-color: rgba(15, 23, 42, .35); }
    .card.batch-selected { background: #F0F6FF; border-color: var(--primary); box-shadow: 0 0 0 1px var(--primary), var(--shadow-1); }
    .card.ai-picked { border-color: rgba(66, 133, 244, .55); box-shadow: inset 0 1px 0 #fff, 0 10px 28px rgba(66, 133, 244, .18); }

    .card-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .card-title {
      font-size: 15.5px; font-weight: 700; line-height: 1.42; color: var(--on-surface);
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .card-desc {
      font-size: 13px; color: var(--on-surface-variant); line-height: 1.55;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }

    .progress { height: 4px; border-radius: 99px; background: rgba(15, 23, 42, .06); overflow: hidden; }
    .progress > i {
      display: block; height: 100%; border-radius: 99px;
      background: var(--c);
      box-shadow: 0 0 8px var(--c-glow, transparent);
      transition: width .55s var(--spring);
    }
    .progress-label {
      display: flex; justify-content: space-between; font-size: 11.5px;
      color: var(--muted); margin-bottom: 5px;
      font-variant-numeric: tabular-nums;
    }

    .card-foot {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      margin-top: auto; padding-top: 10px;
      border-top: 1px solid rgba(15, 23, 42, .06);
      min-height: 40px;
    }
    .card-tags { display: flex; gap: 6px; overflow: hidden; min-width: 0; mask-image: linear-gradient(90deg, #000 85%, transparent); }
    .mobile-step-count { display: none; }

    /* Progressive Disclosure: Hover-Reveal Secondary Actions */
    .card-actions {
      display: flex; align-items: center; gap: 4px; flex-shrink: 0;
      opacity: 0;
      transform: translateY(4px) scale(.97);
      pointer-events: none;
      transition: opacity .25s var(--spring), transform .25s var(--spring);
    }
    .card:hover .card-actions,
    .card:focus-within .card-actions,
    .card.is-done .card-actions {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
    }
    @media (hover: none), (pointer: coarse) {
      .card-actions { opacity: 1; transform: none; pointer-events: auto; }
    }

    .star-btn { opacity: .5; transition: opacity .2s var(--ease), background-color .2s var(--ease), transform .35s var(--spring); }
    .card:hover .star-btn, .star-btn.on { opacity: 1; }
    .star-btn svg { transition: transform .45s var(--spring); }
    .star-btn.on svg { fill: #F59E0B; stroke: #F59E0B; }
    .star-btn:active svg { transform: scale(1.35) rotate(72deg); }

    .check-pill {
      position: relative; overflow: hidden; isolation: isolate;
      height: 28px; padding: 0 10px; border-radius: var(--r-full);
      border: 1px solid rgba(15, 23, 42, .12); background: var(--surface-card); color: var(--on-surface-variant);
      font-size: 11.5px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px;
      transition: all .28s var(--spring);
    }
    .check-pill:hover { background: var(--surface-dim); color: var(--on-surface); border-color: rgba(15, 23, 42, .2); }
    .check-pill:active { transform: scale(.92); border-radius: 10px; }
    .check-pill.done { background: var(--green-bg); color: var(--green-strong); border-color: rgba(22, 163, 74, .25); }

    .card.thinking {
      cursor: wait;
      background: linear-gradient(135deg, #FFFFFF 0%, #F4F1FC 100%);
      border-color: rgba(155, 114, 203, .28);
    }
    .shimmer {
      height: 10px; border-radius: 6px;
      background: linear-gradient(90deg, #ECE6F6 0%, #F8F5FD 50%, #ECE6F6 100%);
      background-size: 200% 100%; animation: shimmer 1.2s linear infinite;
    }
    @keyframes shimmer { to { background-position: -200% 0; } }

    .animate-in .card, .animate-in .list-item, .animate-in .stat, .animate-in .panel {
      animation: rise .5s var(--ease-out) both;
      animation-delay: calc(var(--i, 0) * 30ms);
    }
    @keyframes rise { from { opacity: 0; transform: translateY(12px) scale(.98); } to { opacity: 1; transform: none; } }

    .empty {
      grid-column: 1 / -1; text-align: center; padding: 44px 16px; color: var(--muted);
      background: var(--surface-card); border-radius: var(--r-xl);
      border: 1px dashed rgba(15, 23, 42, .14);
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    .empty-icon {
      width: 48px; height: 48px; border-radius: 16px;
      display: flex; align-items: center; justify-content: center;
      background: var(--surface); color: var(--muted);
      border: 1px solid rgba(15, 23, 42, .06);
    }

    /* =========================================================
       Calendar
       ========================================================= */
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
    .cal-week { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 8px; }
    .cal-cell {
      position: relative; overflow: hidden; isolation: isolate;
      min-height: 88px; padding: 8px; border-radius: 16px; background: var(--surface);
      border: 1px solid transparent; text-align: left; display: flex; flex-direction: column; gap: 4px;
      transition: transform .35s var(--spring), border-radius .35s var(--spring), background-color .2s;
    }
    .cal-cell:hover { background: var(--surface-dim); border-radius: 20px; }
    .cal-cell:active { transform: scale(.95); }
    .cal-cell.empty-cell { background: transparent; pointer-events: none; }
    .cal-cell.selected { border-color: var(--primary); background: #F1F5FD; }
    .cal-num {
      width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 12.5px; font-weight: 600; font-variant-numeric: tabular-nums;
    }
    .cal-cell.today .cal-num { background: var(--primary); color: #fff; }
    .cal-pill {
      font-size: 11px; padding: 1px 7px; border-radius: 6px; background: var(--c-bg); color: var(--c-strong);
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-left: 3px solid var(--c);
    }
    .cal-pill.done { opacity: .5; text-decoration: line-through; }
    .cal-more { font-size: 11px; color: var(--muted); padding-left: 4px; }
    .cal-dots { display: none; gap: 3px; flex-wrap: wrap; }
    .cal-dots i { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }

    /* =========================================================
       Inputs & AI Step Co-pilot Drawer
       ========================================================= */
    .field-label { display: block; font-size: 12px; font-weight: 600; color: var(--on-surface-variant); margin-bottom: 6px; }
    .modal-input {
      width: 100%; padding: 11px 15px; border-radius: 14px;
      border: 1px solid var(--outline); background: var(--surface-card);
      font-size: 14px; color: var(--on-surface); outline: none; margin-bottom: 12px;
      transition: border-color .2s var(--ease), box-shadow .2s var(--ease), border-radius .3s var(--spring);
    }
    .modal-input:hover { border-color: var(--on-surface-variant); }
    .modal-input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(11,87,208,.14); border-radius: 16px; }
    textarea.modal-input { resize: vertical; line-height: 1.6; }
    .search-field { position: relative; margin-bottom: 16px; }
    .search-field svg { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); color: var(--muted); }
    .search-field input { height: 52px; border-radius: var(--r-full); padding-left: 48px; font-size: 14.5px; margin: 0; background: var(--surface-dim); border-color: transparent; }
    .search-field input:focus { background: var(--surface-card); border-radius: var(--r-full); }

    .callout { border-radius: 18px; padding: 13px 16px; margin-bottom: 14px; border: 1px solid; }
    .callout-title { font-size: 12.5px; font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
    .callout.purple { background: var(--reason-bg); border-color: var(--reason-border); color: var(--reason-strong); }
    .callout.neutral { background: var(--surface); border-color: var(--outline-soft); color: var(--on-surface-variant); }
    .callout .modal-input { margin-bottom: 0; }

    /* Interactive AI Step Co-pilot Panel inside Lightbox */
    .ai-copilot-box {
      background: linear-gradient(135deg, #F3F7FF 0%, #F7F0FF 100%);
      border: 1.5px solid #D3E3FD;
      border-radius: 20px;
      padding: 14px 16px;
      margin-bottom: 16px;
      animation: rise .3s var(--ease-out);
    }
    .ai-draft-item {
      display: flex; align-items: center; gap: 8px;
      padding: 7px 10px; border-radius: 10px;
      background: rgba(255,255,255,.85);
      font-size: 13.5px; color: var(--on-surface);
    }
    .ai-draft-item input {
      flex: 1; border: none; background: transparent; font-size: 13.5px; outline: none;
    }

    /* =========================================================
       Modals
       ========================================================= */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(31,31,31,.32);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      z-index: 1000; opacity: 0; pointer-events: none; padding: 16px;
      transition: opacity .3s var(--ease);
    }
    .modal-overlay.open { opacity: 1; pointer-events: auto; }
    .modal-box {
      background: var(--surface-card); border-radius: var(--r-xl);
      padding: 26px; max-width: 640px; width: 100%; max-height: 90vh; overflow-y: auto;
      box-shadow: var(--shadow-3);
      transform: translateY(24px) scale(.94); opacity: .4;
      transition: transform .5s var(--spring), opacity .25s var(--ease);
    }
    .modal-overlay.open .modal-box { transform: none; opacity: 1; }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; gap: 8px; }
    .modal-title { font-size: 21px; font-weight: 700; line-height: 1.4; }
    .sheet-handle { display: none; width: 36px; height: 4px; border-radius: 4px; background: var(--outline); margin: -12px auto 14px; }
    .modal-actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 14px; border-top: 1px solid var(--outline-soft); }

    .ai-box { background: linear-gradient(135deg, #EEF3FE, #F4EEFB); padding: 7px; border-radius: 22px; margin-bottom: 16px; display: flex; gap: 8px; align-items: center; }
    .ai-box .modal-input { margin: 0; border-color: transparent; border-radius: var(--r-full); }

    .step-row {
      position: relative; overflow: hidden; isolation: isolate;
      display: flex; align-items: center; gap: 10px; padding: 9px 12px;
      background: var(--surface); border-radius: 14px; font-size: 14px;
      transition: background-color .2s, border-radius .35s var(--spring);
    }
    .step-row:hover { background: var(--surface-dim); }
    .step-row.done .step-edit-input { text-decoration: line-through; color: var(--muted); }
    .step-edit-input {
      flex: 1; min-width: 0; border: none; background: transparent;
      font-size: 14px; color: var(--on-surface); outline: none;
      padding: 2px 6px; border-radius: 6px;
    }
    .step-edit-input:focus { background: var(--surface-card); box-shadow: 0 0 0 2px var(--primary-container); }

    /* Timer rings */
    .ring-wrap { position: relative; width: 220px; height: 220px; margin: 8px auto 18px; }
    .ring { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring circle { fill: none; stroke-width: 12; }
    .ring-track { stroke: var(--surface-container); }
    .ring-bar { stroke-linecap: round; stroke-dasharray: 552.92; transition: stroke-dashoffset 1s linear; }
    .ring-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .timer-num { font-family: "Google Sans Flex", "Roboto", sans-serif; font-size: 48px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
    .timer-sub { font-size: 12px; color: var(--muted); }
    .ring-wrap.running .ring-bar { filter: drop-shadow(0 0 6px rgba(155,114,203,.4)); }

    #appToast {
      position: fixed; bottom: 24px; left: 50%;
      background: #303030; color: #F2F2F2;
      padding: 13px 20px; border-radius: 14px; font-size: 13.5px; font-weight: 500;
      box-shadow: var(--shadow-3); z-index: 2000;
      opacity: 0; transform: translate(-50%, 20px) scale(.96);
      transition: opacity .25s var(--ease), transform .45s var(--spring);
      pointer-events: none; max-width: calc(100vw - 32px);
    }
    #appToast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

    .fab { display: none; }

    @keyframes spin { to { transform: rotate(360deg); } }

    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-thumb { background: var(--outline); border-radius: 99px; border: 2px solid transparent; background-clip: padding-box; }
    ::-webkit-scrollbar-track { background: transparent; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }

    @media (max-width: 768px) {
      html, body, #main-container { max-width: 100vw; overflow-x: hidden; overflow-x: clip; }
      .panel, .stat-row, .modal-input, #viewArea, .card-grid, .card { max-width: 100%; min-width: 0; }
      body { flex-direction: column; padding-bottom: 80px; }

      /* Bottom Navigation: 6 equal columns, zero horizontal scroll */
      #sidebar, #sidebar.collapsed {
        position: fixed; bottom: 0; left: 0; right: 0; top: auto;
        width: 100%; max-width: 100vw; height: auto;
        padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
        flex-direction: row; background: rgba(240,244,249,.95);
        backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        box-shadow: 0 -1px 0 var(--outline-soft); overflow: hidden;
      }
      #sidebar .brand-row, #sidebar .compose-btn, #sidebar .slogan-card, #sidebar .nav-section, #sidebar .lang-pill-group { display: none !important; }
      nav.rail { flex-direction: row; width: 100%; overflow: hidden; gap: 0; }
      .nav-item, #sidebar.collapsed .nav-item {
        flex-direction: column; justify-content: center; gap: 2px; height: 58px;
        flex: 1; min-width: 0; padding: 0 2px;
        font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        border-radius: 14px; background: transparent !important;
      }
      #sidebar.collapsed .sidebar-hide.nav-label { display: block !important; }
      .nav-item .nav-label {
        max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        text-align: center; line-height: 1.2;
      }
      .nav-item .nav-icon { width: 44px; height: 26px; border-radius: 99px; transition: background-color .3s var(--ease); }
      .nav-indicator { border-radius: 14px; }
      .nav-item .nav-count { display: none; }

      /* Top Fade Scrim behind sticky floating prompt bar */
      #main-container { padding: 12px 14px 24px; }
      #main-container::before {
        content: "";
        position: fixed; top: 0; left: 0; right: 0;
        height: 112px;
        background: linear-gradient(to bottom, var(--surface) 58%, rgba(248, 250, 253, 0) 100%);
        pointer-events: none;
        z-index: 14;
      }

      /* Clean Settings View on Mobile */
      body[data-tab="settings"] .prompt-bar,
      body[data-tab="settings"] #main-container::before,
      body[data-tab="settings"] .fab {
        display: none !important;
      }

      .prompt-bar { top: 8px; z-index: 15; border-radius: 24px; }
      .prompt-bar-inner { flex-wrap: wrap; padding: 8px 10px; }
      .prompt-bar .floating-input { flex-basis: calc(100% - 44px); }
      .prompt-bar .kbd { display: none; }
      #quickTypeSelector { order: 3; flex: 1; min-width: 0; overflow-x: auto; scrollbar-width: none; }
      #quickTypeSelector::-webkit-scrollbar { display: none; }
      #voiceBtn { order: 4; } #aiPlanBtn { order: 5; } #detailBtn { display: none; }
      .display { font-size: 24px; }
      .stat { min-width: calc(50% - 6px); padding: 12px 14px; }

      /* High-Density Compact Mobile Cards (Single Column, ~3.5-4 per screen) */
      .card-grid { grid-template-columns: 1fr; gap: 10px; }
      .card { padding: 12px 14px; gap: 6px; border-radius: 16px; }
      .card .star-btn.sm { width: 24px; height: 24px; }
      .card-title { font-size: 15px; line-height: 1.35; -webkit-line-clamp: 1; }
      .card-desc { font-size: 12.5px; line-height: 1.4; -webkit-line-clamp: 1; }
      .card-actions { display: none !important; }
      .card-foot {
        border-top: none; padding-top: 0; margin-top: 2px; min-height: 0;
        order: 1;
      }
      .card-foot.is-mobile-empty { display: none; }
      .mobile-step-count {
        display: inline-flex; align-items: center; gap: 4px;
        font-size: 11.5px; font-weight: 600; color: var(--muted);
        font-variant-numeric: tabular-nums; flex-shrink: 0;
      }
      .card-progress-wrap { order: 2; }
      .card-progress-wrap .progress-label { display: none; }
      .card-progress-wrap .progress { height: 4px; }

      .cal-cell { min-height: 54px; padding: 4px; align-items: center; }
      .cal-pill, .cal-more { display: none; }
      .cal-dots { display: flex; justify-content: center; }

      .modal-overlay { align-items: flex-end; padding: 0; }
      .modal-box {
        border-radius: 28px 28px 0 0; max-height: 92vh; padding: 24px 20px calc(20px + env(safe-area-inset-bottom));
        transform: translateY(100%); opacity: 1;
      }
      .sheet-handle { display: block; }

      .fab {
        display: flex; position: fixed; right: 16px; bottom: calc(88px + env(safe-area-inset-bottom)); z-index: 30;
        width: 56px; height: 56px; border-radius: 18px; border: none;
        background: var(--primary-container); color: var(--on-primary-container);
        align-items: center; justify-content: center; box-shadow: var(--shadow-3);
      }
      #appToast { bottom: calc(96px + env(safe-area-inset-bottom)); }
    }
  </style>
</head>

      el.appendChild(w);
      w.addEventListener('animationend', () => w.remove());
    }, { passive: true });

    function burst(x = lastPointer.x, y = lastPointer.y) {
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const colors = ['#4285F4', '#EA4335', '#FBBC04', '#34A853', '#9B72CB'];
      for (let i = 0; i < 16; i++) {
        const p = document.createElement('span');
        p.className = 'particle';
        p.style.background = colors[i % colors.length];
        p.style.left = x + 'px'; p.style.top = y + 'px';
        document.body.appendChild(p);
        const a = (Math.PI * 2 * i) / 16 + Math.random() * 0.4;
        const dist = 40 + Math.random() * 60;
        p.animate([
          { transform: 'translate(-50%,-50%) scale(1)', opacity: 1 },
          { transform: `translate(calc(-50% + ${Math.cos(a) * dist}px), calc(-50% + ${Math.sin(a) * dist + 20}px)) scale(.2)`, opacity: 0 }
        ], { duration: 700, easing: 'cubic-bezier(.2,0,0,1)' }).onfinish = () => p.remove();
      }
    }

    let audioCtx = null;
    function tone(freq, start, dur, vol) {
      try {
        if (!audioCtx) { const A = window.AudioContext || window.webkitAudioContext; if (A) audioCtx = new A(); }
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const tm = audioCtx.currentTime + start;
        const o = audioCtx.createOscillator(), g = audioCtx.createGain();
        o.type = 'sine'; o.frequency.setValueAtTime(freq, tm);
        g.gain.setValueAtTime(0, tm); g.gain.linearRampToValueAtTime(vol, tm + 0.03);
        g.gain.exponentialRampToValueAtTime(0.001, tm + dur);
        o.connect(g); g.connect(audioCtx.destination); o.start(tm); o.stop(tm + dur);
      } catch (e) {}
    }

    // ==========================================
    // 4. Hybrid AI Engine (0-Token Filter + Gemini 3.8 Flash + Timeout)
    // ==========================================
    const DEFAULT_MODEL = 'gemini-3.8-flash';
    const getStoredGeminiKey = () => localStorage.getItem('mindnote_gemini_api_key') || '';
    const getStoredModel = () => localStorage.getItem('mindnote_gemini_model') || DEFAULT_MODEL;

    async function callGeminiRaw(promptText, maxTokens = 380) {
      const apiKey = getStoredGeminiKey();
      if (!apiKey) return null;
      const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(getStoredModel())}:generateContent`;
      const payload = {
        contents: [{ parts: [{ text: promptText }] }],
        generationConfig: { temperature: 0.2, maxOutputTokens: maxTokens, thinkingConfig: { thinkingBudget: 0 }, responseMimeType: 'application/json' }
      };
      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 10000);
      const doFetch = () => fetch(endpoint, {
        method: 'POST', signal: controller.signal,
        headers: { 'Content-Type': 'application/json', 'x-goog-api-key': apiKey },
        body: JSON.stringify(payload)
      });
      try {
        let res = await doFetch();
        if (!res.ok && res.status === 400) { delete payload.generationConfig.thinkingConfig; res = await doFetch(); }
        if (!res.ok) return null;
        const data = await res.json();
        const text = data.candidates?.[0]?.content?.parts?.[0]?.text;
        return text ? JSON.parse(text.replace(/^```json\s*|```$/g, '').trim()) : null;
      } catch (e) { return null; }
      finally { clearTimeout(timer); }
    }

    function parseDueOffset(q) {
      if (/今天|今晚|今早|today/i.test(q)) return 0;
      if (/後天|后天/.test(q)) return 2;
      if (/明天|明早|tomorrow/i.test(q)) return 1;
      const wk = q.match(/(下|這|这|本)?(週|周|星期|禮拜|礼拜)([一二三四五六日天])/);
      if (wk) {
        const map = { 日: 0, 天: 0, 一: 1, 二: 2, 三: 3, 四: 4, 五: 5, 六: 6 };
        let diff = (map[wk[3]] - new Date().getDay() + 7) % 7;
        if (wk[1] === '下') diff += 7; else if (diff === 0) diff = 7;
        return diff;
      }
      if (/下週|下周|next week/i.test(q)) return 7;
      return 0;
    }

    // 0-Token Short-Task Detection
    function isSimpleShortTask(q) {
      const clean = q.trim();
      const hasComplexCue = /期中|期末|報告|报告|論文|论文|paper|簡報|简报|專案|项目|計劃|计划|研究|複習|复习|實驗|实验|exam|essay|project/i.test(clean);
      return clean.length <= 9 && !hasComplexCue;
    }

    function localRuleEnginePlan(rawInput) {
      const q = rawInput.trim();
      const isAcad = /期中|期末|考|作業|作业|報告|报告|論文|论文|paper|研究|課|课|講義|讲义|生物|化學|化学|程式|實驗|实验|exam|study/i.test(q);
      const type = isAcad ? 'academic' : 'memo';
      let title = q.replace(/(今天|明天|後天|后天|今晚|明早|早上|下午|晚上|(下|這|这|本)?(週|周|星期|禮拜|礼拜)[一二三四五六日天]|下週|下周|之前|前)/g, '').trim() || q;
      if (title.length > 22) title = title.slice(0, 21) + '…';
      return {
        type, title, content: '', reason: '',
        dueDate: getRelativeDateStr(parseDueOffset(q)),
        tags: [isAcad ? (currentLang === 'en' ? '#Academic' : '#學術') : (currentLang === 'en' ? '#Memo' : '#備忘')],
        steps: []
      };
    }

    async function smartPlanTask(rawInput, forceAi = false) {
      if (!forceAi && isSimpleShortTask(rawInput)) {
        return { ...localRuleEnginePlan(rawInput), usedAi: false };
      }
      const prompt = `Today is ${todayStr()}. ${t('aiLangInstruction')} Convert "${rawInput}" to JSON: {"category":"academic|memo","clean_title":"concise action title without date words","detail":"optional 1-sentence note not repeating title","days":integer days from today,"steps":["step1","step2","step3"],"why":"short motivation","tags":["#tag"]}. Only output JSON.`;
      const p = await callGeminiRaw(prompt, 360);
      if (!p) return { ...localRuleEnginePlan(rawInput), usedAi: false };
      const type = p.category === 'academic' ? 'academic' : 'memo';
      const days = Number.isFinite(+p.days) ? Math.max(0, Math.round(+p.days)) : parseDueOffset(rawInput);
      return {
        usedAi: true, type,
        title: p.clean_title || rawInput.slice(0, 20),
        content: (p.detail && p.detail !== p.clean_title) ? p.detail : '',
        reason: p.why || '',
        dueDate: getRelativeDateStr(days),
        steps: (p.steps || []).slice(0, 5).map(s => ({ id: uid('s'), text: String(s), completed: false })),
        tags: Array.isArray(p.tags) && p.tags.length ? p.tags.map(x => String(x).startsWith('#') ? String(x) : '#' + x).slice(0, 3) : []
      };
    }

    async function executeAiQuickCapture() {
      const input = $('quickPromptInput');
      const val = input.value.trim();
      const btn = $('aiPlanBtn');
      if (!val || btn.disabled) { if (!val) input.focus(); return; }

      // Fast 0-token path for simple short tasks
      if (isSimpleShortTask(val) || !getStoredGeminiKey()) {
        const p = localRuleEnginePlan(val);
        if (quickSelectedType !== 'auto') p.type = quickSelectedType;
        notes.unshift({ id: uid('note'), ...p, createdAt: new Date().toISOString(), completed: false, starred: false });
        input.value = '';
        saveState(); playTickChime();
        showToast(`⚡ ${p.title} (0 Token)`);
        return;
      }

      const orig = btn.innerHTML;
      input.readOnly = true; $('promptBar').classList.add('is-thinking');
      btn.disabled = true; btn.innerHTML = `${ICON.spinner}<span>${t('thinking')}</span>`;

      const tempId = 'temp-' + Date.now();
      notes.unshift({ id: tempId, type: quickSelectedType === 'auto' ? 'memo' : quickSelectedType, title: val.slice(0, 22), completed: false, tags: [], steps: [], isOptimistic: true });
      renderCurrentView();

      try {
        const p = await smartPlanTask(val, true);
        if (quickSelectedType !== 'auto') p.type = quickSelectedType;
        const finalNote = { id: uid('note'), type: p.type, title: p.title, content: p.content, reason: p.reason, createdAt: new Date().toISOString(), dueDate: p.dueDate, completed: false, starred: false, tags: p.tags, steps: p.steps };
        const idx = notes.findIndex(n => n.id === tempId);
        if (idx !== -1) notes[idx] = finalNote; else notes.unshift(finalNote);
        input.value = '';
        saveState(); playSuccessChime();
        showToast(`✨ ${finalNote.title}`);
      } finally {
        const hadTemp = notes.some(n => n.id === tempId);
        if (hadTemp) {
          notes = notes.filter(n => n.id !== tempId);
          renderCurrentView();
        }
        input.readOnly = false; $('promptBar').classList.remove('is-thinking');
        btn.disabled = false; btn.innerHTML = orig; input.focus();
      }
    }

    // Chrome-style "Ask Gemini" to pick 1 task right now
    async function askGeminiWhatToDo() {
      const pending = notes.filter(n => !n.completed && !n.isOptimistic);
      if (!pending.length) { showToast(t('emptyFlow')); return; }
      isAskingGemini = true;
      renderCurrentView();

      const nowTime = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
      const summary = pending.slice(0, 12).map(n => ({ id: n.id, title: n.title, cat: n.type, due: n.dueDate || 'none', starred: n.starred, stepsLeft: (n.steps || []).filter(s => !s.completed).length }));
      const prompt = `Current local time: ${nowTime}, Date: ${todayStr()}. ${t('aiLangInstruction')} User has ADHD and doesn't know what to start right now. Pick the SINGLE best task from this list: ${JSON.stringify(summary)}. Return JSON ONLY: {"id":"chosen_id","reason":"1 short warm practical sentence explaining why do this right now"}.`;

      const res = await callGeminiRaw(prompt, 180);
      isAskingGemini = false;
      if (res && pending.some(n => n.id === res.id)) {
        aiPickResult = { id: res.id, reason: res.reason };
      } else {
        // Offline smart fallback
        const best = sortNotes(pending, 'due')[0];
        aiPickResult = {
          id: best.id,
          reason: currentLang === 'en'
            ? `Start with "${best.title}" — it's your closest priority right now.`
            : currentLang === 'zh-CN'
              ? `先动手「${best.title}」吧，这是目前时间最紧迫的一件事，解决掉会轻松很多。`
              : `先動手「${best.title}」吧，這是目前時間最緊迫的一件事，解決掉會輕鬆很多。`
        };
      }
      playTickChime();
      renderCurrentView();
    }

    // ==========================================
    // 5. Interactive AI Step Co-pilot inside Lightbox
    // ==========================================
    let copilotState = null; // { noteId, targetStepId|null, drafts: string[], loading: boolean }

    async function openAiStepCopilot(noteId, targetStepId = null, feedback = '') {
      const note = notes.find(n => n.id === noteId);
      if (!note) return;
      const targetStep = targetStepId ? (note.steps || []).find(s => s.id === targetStepId) : null;
      copilotState = { noteId, targetStepId, drafts: copilotState?.drafts || [], loading: true };
      renderLightboxCopilot();

      const baseContext = targetStep
        ? `Break down this single step "${targetStep.text}" (from task "${note.title}") into 2-4 tiny concrete sub-steps.`
        : `Generate 3-5 concrete, actionable checklist steps for task "${note.title}" (${note.content || ''}).`;
      const refineNote = feedback ? ` User feedback on previous draft (${JSON.stringify(copilotState.drafts)}): "${feedback}". Adjust accordingly.` : '';
      const prompt = `${t('aiLangInstruction')} ${baseContext}${refineNote} Return JSON ONLY: {"steps":["step1","step2","step3"]}.`;

      const res = await callGeminiRaw(prompt, 320);
      if (res && Array.isArray(res.steps) && res.steps.length) {
        copilotState.drafts = res.steps.map(String);
      } else {
        const label = targetStep ? targetStep.text : note.title;
        copilotState.drafts = currentLang === 'en'
          ? [`Open materials for "${label}"`, `Draft first 20% quickly`, `Review & wrap up`]
          : currentLang === 'zh-CN'
            ? [`打开「${label}」需要的档案或讲义`, `先完成最简单的前 20% 内容`, `检查重点并收尾`]
            : [`打開「${label}」需要的檔案或講義`, `先完成最簡單的前 20% 內容`, `檢查重點並收尾`];
      }
      copilotState.loading = false;
      renderLightboxCopilot();
    }

    function renderLightboxCopilot() {
      const box = $('lightboxCopilotArea');
      if (!box) return;
      if (!copilotState) { box.innerHTML = ''; return; }
      if (copilotState.loading) {
        box.innerHTML = `<div class="ai-copilot-box row gap8">${ICON.spinner}<span>${t('thinking')}…</span></div>`;
        return;
      }
      box.innerHTML = `
        <div class="ai-copilot-box">
          <div class="row" style="justify-content:space-between; margin-bottom:10px;">
            <span class="row gap6" style="font-size:13px; font-weight:700; color:#0B57D0;">${ICON.spark}<span>${t('copilotTitle')}</span></span>
            <button class="icon-btn sm" onclick="copilotState=null; renderLightboxCopilot();">✕</button>
          </div>
          <div class="list" style="margin-bottom:10px;">
            ${copilotState.drafts.map((d, idx) => `
              <div class="ai-draft-item">
                <span style="color:var(--primary); font-weight:700; font-size:12px; font-variant-numeric:tabular-nums;">${idx + 1}.</span>
                <input value="${esc(d)}" oninput="copilotState.drafts[${idx}]=this.value">
                <button class="icon-btn sm" onclick="copilotState.drafts.splice(${idx},1); renderLightboxCopilot();">✕</button>
              </div>`).join('')}
          </div>
          <div class="row gap6" style="margin-bottom:10px;">
            <input id="copilotFeedbackInput" class="modal-input" style="margin:0; height:36px; font-size:13px;" placeholder="${t('copilotPh')}"
                   onkeydown="if(event.key==='Enter' && !event.isComposing) refineCopilotDrafts()">
            <button class="btn btn-outlined sm" onclick="refineCopilotDrafts()">${t('copilotRefine')}</button>
          </div>
          <div class="row gap8" style="justify-content:flex-end;">
            <button class="btn btn-text sm" onclick="copilotState=null; renderLightboxCopilot();">${t('cancel')}</button>
            <button class="btn btn-filled sm" onclick="adoptCopilotDrafts()">${ICON.check}<span>${t('copilotAdopt')}</span></button>
          </div>
        </div>`;
    }

    function refineCopilotDrafts() {
      const fb = $('copilotFeedbackInput')?.value.trim();
      if (!copilotState) return;
      openAiStepCopilot(copilotState.noteId, copilotState.targetStepId, fb || 'Make it clearer and easier to start');
    }

    function adoptCopilotDrafts() {
      if (!copilotState) return;
      const { noteId, targetStepId, drafts } = copilotState;
      const clean = drafts.map(s => s.trim()).filter(Boolean).map(text => ({ id: uid('s'), text, completed: false }));
      if (!clean.length) return;
      notes = notes.map(n => {
        if (n.id !== noteId) return n;
        const old = n.steps || [];
        if (targetStepId) {
          const idx = old.findIndex(s => s.id === targetStepId);
          if (idx !== -1) {
            const next = [...old];
            next.splice(idx, 1, ...clean);
            return { ...n, steps: next };
          }
        }
        return { ...n, steps: [...old, ...clean] };
      });
      copilotState = null;
      saveState(); playSuccessChime();
      openLightboxModal(noteId);
    }

    // ==========================================
    // 6. Voice Input
    // ==========================================
    let isListening = false, recognitionInstance = null;
    function setVoiceUi(on) { const b = $('voiceBtn'); b.style.background = on ? 'var(--academic-bg)' : ''; b.style.color = on ? 'var(--academic)' : ''; }
    function toggleVoiceInput() {
      const R = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!R) { showToast('Browser does not support SpeechRecognition'); return; }
      if (isListening && recognitionInstance) { recognitionInstance.stop(); return; }
      try {
        recognitionInstance = new R();
        recognitionInstance.continuous = true; recognitionInstance.interimResults = true;
        recognitionInstance.lang = currentLang === 'en' ? 'en-US' : currentLang;
        recognitionInstance.onstart = () => { isListening = true; setVoiceUi(true); haptic(15); showToast('🎤 Listening…'); };
        recognitionInstance.onresult = e => {
          let txt = '';
          for (let i = e.resultIndex; i < e.results.length; i++) if (e.results[i].isFinal) txt += e.results[i][0].transcript;
          if (txt) { const inp = $('quickPromptInput'); inp.value = (inp.value ? inp.value + ' ' : '') + txt; }
        };
        recognitionInstance.onerror = recognitionInstance.onend = () => { isListening = false; setVoiceUi(false); };
        recognitionInstance.start();
      } catch (e) { showToast('Microphone permission denied'); }
    }

    // ==========================================
    // 7. Rendering Helpers & Sorting
    // ==========================================
    const catLabel = (type, full = false) => type === 'academic' ? t(full ? 'catAcademic' : 'academicShort') : t(full ? 'catMemo' : 'memoShort');
    const catChip = (type, full = false) => `<span class="cat-badge cat-${type}"><span class="laser-dot"></span><span>${catLabel(type, full)}</span></span>`;

    function getDueBadgeHtml(dueDate) {
      const d = daysUntil(dueDate);
      if (d === null) return '';
      if (d < 0) return `<span class="chip due-over">${t('dueOver')(-d)}</span>`;
      if (d === 0) return `<span class="chip due-today">${t('dueToday')}</span>`;
      if (d === 1) return `<span class="chip due-tmr">${t('dueTmr')}</span>`;
      return `<span class="chip due-later">${t('dueLater')(d)}</span>`;
    }

    function stepProgressHtml(n) {
      if (!n.steps?.length) return '';
      const done = n.steps.filter(s => s.completed).length;
      return `<div class="card-progress-wrap"><div class="progress-label"><span>${t('stepProgress')}</span><span>${done}/${n.steps.length}</span></div>
              <div class="progress"><i style="width:${Math.round(done / n.steps.length * 100)}%"></i></div></div>`;
    }

    function batchToolbarHtml() {
      if (!isBatchMode) return `<button class="btn btn-outlined sm" onclick="toggleBatchMode()">${ICON.edit}<span>${t('batchEdit')}</span></button>`;
      const ids = currentViewIds.filter(id => !String(id).startsWith('temp-'));
      const allSel = ids.length > 0 && selectedNoteIds.size === ids.length;
      return `
        <button class="btn btn-text sm" onclick="selectAllCurrentNotes()">${allSel ? t('unselectAll') : t('selectAll')}</button>
        <button class="btn btn-danger sm" onclick="deleteBatchSelected()" ${!selectedNoteIds.size ? 'disabled' : ''}>${ICON.trash}<span>${t('deleteSel')} (${selectedNoteIds.size})</span></button>
        <button class="btn btn-filled sm" onclick="toggleBatchMode()">${t('done')}</button>`;
    }

    function sortNotes(list, mode = 'due') {
      return [...list].sort((a, b) => {
        if (a.isOptimistic) return -1; if (b.isOptimistic) return 1;
        if (a.completed !== b.completed) return a.completed ? 1 : -1;
        if (mode === 'starred') {
          if (a.starred !== b.starred) return b.starred ? 1 : -1;
        } else if (mode === 'newest') {
          return new Date(b.createdAt) - new Date(a.createdAt);
        }
        const da = daysUntil(a.dueDate), db = daysUntil(b.dueDate);
        const va = da === null ? 9999 : da, vb = db === null ? 9999 : db;
        if (va !== vb) return va - vb;
        return (b.starred ? 1 : 0) - (a.starred ? 1 : 0);
      });
    }

    function renderCompactCardHtml(n, i = 0) {
      if (n.isOptimistic) {
        return `<article class="card thinking" style="--i:${i}">
          <div class="card-top"><span class="cat-badge cat-auto">${ICON.spinner}<span>${t('thinking')}</span></span></div>
          <h3 class="card-title" style="color:#5B3E96;">${esc(n.title)}</h3>
          <div class="shimmer" style="width:90%"></div><div class="shimmer" style="width:65%"></div>
        </article>`;
      }
      const sel = selectedNoteIds.has(n.id);
      const picked = aiPickResult?.id === n.id;
      const hasContent = n.content && n.content.trim() !== n.title.trim();
      const stepTotal = n.steps?.length || 0;
      const stepDone = stepTotal ? n.steps.filter(s => s.completed).length : 0;
      const hasTags = Boolean(n.tags && n.tags.length);
      return `
        <article class="card cat-${n.type} ${sel ? 'batch-selected' : ''} ${n.completed ? 'is-done' : ''} ${picked ? 'ai-picked' : ''}" style="--i:${i}" onclick="handleCardClick('${esc(n.id)}', event)">
          <div class="card-top">
            <div class="row gap8">
              ${isBatchMode ? `<label class="round-check" style="--c:var(--primary)" onclick="event.stopPropagation()"><input type="checkbox" ${sel ? 'checked' : ''} onchange="toggleSelectNote('${esc(n.id)}', event)"><span></span></label>` : ''}
              ${catChip(n.type)}
            </div>
            <div class="row gap6">
              ${n.completed ? '' : getDueBadgeHtml(n.dueDate)}
              <button class="icon-btn sm star-btn ${n.starred ? 'on' : ''}" onclick="event.stopPropagation(); toggleStar('${esc(n.id)}')" style="color:${n.starred ? '#F59E0B' : 'var(--muted)'}">${ICON.star}</button>
            </div>
          </div>
          <h3 class="card-title">${esc(n.title)}</h3>
          ${hasContent ? `<p class="card-desc">${esc(n.content)}</p>` : ''}
          ${stepProgressHtml(n)}
          <div class="card-foot ${!hasTags && !stepTotal ? 'is-mobile-empty' : ''}">
            <div class="card-tags">${(n.tags || []).map(x => `<span class="tag">${esc(x)}</span>`).join('')}</div>
            ${stepTotal ? `<span class="mobile-step-count">${stepDone}/${stepTotal}</span>` : ''}
            <div class="card-actions">
              ${n.completed ? '' : `<button class="btn btn-text xs" onclick="event.stopPropagation(); openSprintModal('${esc(n.id)}')">${ICON.timer}<span>${t('sprint')}</span></button>`}
              <button class="check-pill ${n.completed ? 'done' : ''}" onclick="event.stopPropagation(); toggleNoteComplete('${esc(n.id)}')">${ICON.check}<span>${n.completed ? t('completed') : t('done')}</span></button>
            </div>
          </div>
        </article>`;
    }

    function handleCardClick(id, e) { isBatchMode ? toggleSelectNote(id, e) : openLightboxModal(id); }

    // ==========================================
    // 8. Views
    // ==========================================
    function renderCurrentView() {
      const c = $('viewArea'); if (!c) return;
      c.classList.toggle('animate-in', animateNext); animateNext = false;
      const views = {
        home: () => renderHomeView(c),
        academic: () => renderCategoryView(c, 'academic'),
        memo: () => renderCategoryView(c, 'memo'),
        calendar: () => renderCalendarView(c),
        search: () => renderSearchView(c),
        settings: () => renderSettingsView(c)
      };
      (views[currentTab] || views.home)();
      updateNavCounts();
    }

    function greeting() {
      const h = new Date().getHours();
      if (currentLang === 'en') return h < 12 ? ['Good morning', 'one step at a time'] : h < 18 ? ['Good afternoon', 'keep your rhythm'] : ['Good evening', 'wrap up calmly'];
      if (currentLang === 'zh-CN') return h < 11 ? ['早安', '先做一件小事就好'] : h < 18 ? ['下午好', '保持你的节奏'] : ['晚上好', '收个漂亮的尾'];
      return h < 11 ? ['早安', '先做一件小事就好'] : h < 18 ? ['下午好', '保持你的節奏'] : ['晚上好', '收個漂亮的尾'];
    }

    function renderHomeView(container) {
      const locale = currentLang === 'en' ? 'en-US' : currentLang;
      const todayFormatted = new Intl.DateTimeFormat(locale, { month: 'long', day: 'numeric', weekday: 'long' }).format(new Date());
      const [gHead, gTail] = greeting();
      const real = notes.filter(n => !n.isOptimistic);
      const dueToday = real.filter(n => !n.completed && daysUntil(n.dueDate) === 0).length;
      const overdue = real.filter(n => { const d = daysUntil(n.dueDate); return !n.completed && d !== null && d < 0; }).length;
      const doneCount = real.filter(n => n.completed).length;

      // Priority Flow Filtering & Sorting (Default: within 7 days)
      let flowList = notes.filter(n => !n.completed);
      if (flowSort === '7days') {
        flowList = flowList.filter(n => { if (n.isOptimistic) return true; const d = daysUntil(n.dueDate); return d === null || d <= 7; });
      } else if (flowSort === 'today') {
        flowList = flowList.filter(n => { if (n.isOptimistic) return true; const d = daysUntil(n.dueDate); return d !== null && d <= 0; });
      }
      flowList = sortNotes(flowList, flowSort);

      const allSorted = sortNotes(notes, flowSort);
      currentViewIds = allSorted.map(n => n.id);
      const pickedNote = aiPickResult ? notes.find(n => n.id === aiPickResult.id && !n.completed) : null;

      container.innerHTML = `
        <div class="page-head">
          <div>
            <div class="eyebrow">${todayFormatted}</div>
            <h1 class="display"><span class="grad">${gHead}</span>${currentLang === 'en' ? ', ' : '，'}${gTail}</h1>
          </div>
          <div class="row gap8 wrap">${batchToolbarHtml()}</div>
        </div>

        <div class="stat-row">
          <div class="stat" style="--i:0"><div class="stat-icon tone-amber">${ICON.statSun}</div><div><div class="stat-num">${dueToday}</div><div class="stat-label">${t('statToday')}</div></div></div>
          <div class="stat" style="--i:1"><div class="stat-icon tone-crimson">${ICON.statAlert}</div><div><div class="stat-num" style="color:${overdue ? 'var(--academic-strong)' : 'inherit'}">${overdue}</div><div class="stat-label">${t('statOver')}</div></div></div>
          <div class="stat" style="--i:2"><div class="stat-icon tone-azure">${ICON.statPin}</div><div><div class="stat-num">${real.filter(n => !n.completed).length}</div><div class="stat-label">${t('statPending')}</div></div></div>
          <div class="stat" style="--i:3"><div class="stat-icon tone-emerald">${ICON.statDone}</div><div><div class="stat-num" style="color:var(--green-strong)">${doneCount}</div><div class="stat-label">${t('statDone')}</div></div></div>
        </div>

        <section class="panel" style="--i:2">
          <div class="panel-head">
            <div class="panel-title">
              <span>${t('priorityFlow')}</span>
              <span class="hint">(${flowList.length})</span>
            </div>
            <div class="row gap8 wrap">
              <select class="sort-select" onchange="setFlowSort(this.value)">
                <option value="7days" ${flowSort === '7days' ? 'selected' : ''}>${t('sort7d')}</option>
                <option value="all" ${flowSort === 'all' ? 'selected' : ''}>${t('sortAll')}</option>
                <option value="today" ${flowSort === 'today' ? 'selected' : ''}>${t('sortToday')}</option>
                <option value="due" ${flowSort === 'due' ? 'selected' : ''}>${t('sortDue')}</option>
                <option value="starred" ${flowSort === 'starred' ? 'selected' : ''}>${t('sortStar')}</option>
                <option value="newest" ${flowSort === 'newest' ? 'selected' : ''}>${t('sortNew')}</option>
              </select>
              <button class="btn btn-ask-gemini sm" onclick="askGeminiWhatToDo()" ${isAskingGemini ? 'disabled' : ''}>
                ${isAskingGemini ? ICON.spinner : ICON.spark}
                <span>${isAskingGemini ? t('askingGemini') : t('askGemini')}</span>
              </button>
            </div>
          </div>

          ${pickedNote ? `
            <div class="gemini-advice-banner">
              <div class="gemini-advice-text">
                <b>${ICON.spark} Gemini：</b><span>${esc(aiPickResult.reason)}</span>
              </div>
              <div class="row gap6">
                <button class="btn btn-filled xs" onclick="openLightboxModal('${esc(pickedNote.id)}')">${t('openCard')}</button>
                <button class="icon-btn sm" onclick="aiPickResult=null; renderCurrentView();">✕</button>
              </div>
