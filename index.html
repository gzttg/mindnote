          <div class="list">
            ${!flowList.length ? `<p style="text-align:center; padding:20px; color:var(--muted);">${t('emptyFlow')}</p>` : ''}
            ${flowList.slice(0, 7).map((n, i) => n.isOptimistic ? `
              <div class="list-item cat-auto" style="--i:${i}; background:#F6F2FC;">
                <span style="color:#9B72CB;">${ICON.spinner}</span>
                <div class="li-main"><div class="li-title" style="color:#5B3E96;">${esc(n.title)}</div></div>
              </div>` : `
              <div class="list-item cat-${n.type} ${pickedNote?.id === n.id ? 'ai-picked' : ''}" style="--i:${i}">
                <label class="round-check" onclick="event.stopPropagation()"><input type="checkbox" onchange="toggleNoteComplete('${esc(n.id)}')"><span></span></label>
                <div class="li-main" onclick="openLightboxModal('${esc(n.id)}')">
                  <div class="row gap8" style="min-width:0;">${catChip(n.type)}<span class="meta-sep">·</span><span class="li-title">${esc(n.title)}</span>${getDueBadgeHtml(n.dueDate)}</div>

    // Calendar View
    let calOffset = 0, calSelected = todayStr();
    function shiftMonth(d) { calOffset = d === 0 ? 0 : calOffset + d; if (d === 0) calSelected = todayStr(); renderCurrentView(); }
    function selectCalDay(ds) { calSelected = ds; haptic(6); renderCurrentView(); }

    function renderCalendarView(container) {
      const base = new Date(); base.setDate(1); base.setMonth(base.getMonth() + calOffset);
      const y = base.getFullYear(), m = base.getMonth();
      const firstDay = new Date(y, m, 1).getDay(), totalDays = new Date(y, m + 1, 0).getDate();
      const tStr = todayStr(), byDate = {};
      notes.forEach(n => { if (n.dueDate && !n.isOptimistic) (byDate[n.dueDate] = byDate[n.dueDate] || []).push(n); });

      const cells = [];
      for (let i = 0; i < firstDay; i++) cells.push('<div class="cal-cell empty-cell"></div>');
      for (let d = 1; d <= totalDays; d++) {
        const ds = `${y}-${pad(m + 1)}-${pad(d)}`, list = byDate[ds] || [];
        cells.push(`<button class="cal-cell ${ds === tStr ? 'today' : ''} ${ds === calSelected ? 'selected' : ''}" onclick="selectCalDay('${ds}')">
          <span class="cal-num">${d}</span>
          ${list.slice(0, 2).map(n => `<span class="cal-pill cat-${n.type} ${n.completed ? 'done' : ''}">${esc(n.title)}</span>`).join('')}
          ${list.length > 2 ? `<span class="cal-more">+${list.length - 2}</span>` : ''}
          <span class="cal-dots">${list.slice(0, 4).map(n => `<i class="cat-${n.type}"></i>`).join('')}</span>
        </button>`);
      }
      const selList = sortNotes(byDate[calSelected] || [], 'due');
      currentViewIds = selList.map(n => n.id);
      const wks = currentLang === 'en' ? ['S','M','T','W','T','F','S'] : ['日','一','二','三','四','五','六'];

      container.innerHTML = `
        <div class="page-head">
          <div><div class="eyebrow">${t('calTitle')}</div><h1 class="display">${y} / ${m + 1}</h1><p class="page-sub">${t('calSub')}</p></div>
          <div class="row gap4">
            <button class="icon-btn" onclick="shiftMonth(-1)">${ICON.chevL}</button>
            <button class="btn btn-outlined sm" onclick="shiftMonth(0)">${t('today')}</button>
            <button class="icon-btn" onclick="shiftMonth(1)">${ICON.chevR}</button>
          </div>
        </div>
        <section class="panel">
          <div class="cal-week">${wks.map(w => `<span>${w}</span>`).join('')}</div>
          <div class="cal-grid">${cells.join('')}</div>
        </section>
        <div class="panel-head">
          <h2 class="section-title">${calSelected} <span class="hint">${selList.length}</span></h2>
          <button class="btn btn-text sm" onclick="openNewModal('${calSelected}')">${t('addOnDay')}</button>
        </div>
        <div class="card-grid">${selList.length ? selList.map((n, i) => renderCompactCardHtml(n, i)).join('') : `<div class="empty"><div class="empty-icon">${ICON.emptyLeaf}</div><div>${t('emptyDay')}</div></div>`}</div>`;
    }

    // Search View
    let searchKw = '';
    function toggleSearchTag(tag) {
      searchKw = searchKw === tag ? '' : tag;
      const inp = $('searchInput');
      if (inp) inp.value = searchKw;
      updateSearchResults();
    }
    function renderSearchView(container) {
      container.innerHTML = `
        <div class="page-head"><div><div class="eyebrow">${t('searchTitle')}</div><h1 class="display">${t('searchTitle')}</h1></div></div>
        <div class="search-field">${ICON.search}<input id="searchInput" class="modal-input" placeholder="${t('searchPh')}" value="${esc(searchKw)}" oninput="searchKw=this.value; updateSearchResults();"></div>
        <div id="tagCloud" class="row gap6 wrap" style="margin-bottom:20px;"></div>
        <div id="searchResults"></div>`;
      updateSearchResults();
    }
    function updateSearchResults() {
      const map = {};
      notes.forEach(n => (n.tags || []).forEach(x => { map[x] = n.type; }));
      $('tagCloud').innerHTML = Object.keys(map).map(x => `<button class="fchip cat-${map[x]} ${searchKw === x ? 'selected' : ''}" data-tag="${esc(x)}" onclick="toggleSearchTag(this.dataset.tag)"><span class="dot"></span>${esc(x)}</button>`).join('');
      const q = searchKw.trim().toLowerCase();
      const filtered = sortNotes(notes.filter(n => !n.isOptimistic && (!q || n.title.toLowerCase().includes(q) || (n.content || '').toLowerCase().includes(q) || (n.tags || []).some(x => x.toLowerCase().includes(q)))), 'due');
      currentViewIds = filtered.map(n => n.id);
      $('searchResults').innerHTML = `<div class="card-grid">${filtered.length ? filtered.map((n, i) => renderCompactCardHtml(n, i)).join('') : `<div class="empty"><div class="empty-icon">${ICON.search}</div><div>${t('searchEmpty')}</div></div>`}</div>`;
    }

    // Settings View
    function renderSettingsView(container) {
      const currentKey = getStoredGeminiKey();
      container.innerHTML = `
        <div class="page-head"><div><div class="eyebrow">${t('navSettings')}</div><h1 class="display">${t('settingsTitle')}</h1><p class="page-sub">${t('settingsSub')}</p></div></div>

        <section class="panel">
          <div class="panel-title" style="margin-bottom:12px;">${ICON.globe}<span>${t('langLabel')}</span></div>
          <div class="row gap8 wrap">
            <button class="fchip ${currentLang === 'zh-TW' ? 'selected' : ''}" onclick="setLanguage('zh-TW')">繁體中文</button>
            <button class="fchip ${currentLang === 'zh-CN' ? 'selected' : ''}" onclick="setLanguage('zh-CN')">简体中文</button>
            <button class="fchip ${currentLang === 'en' ? 'selected' : ''}" onclick="setLanguage('en')">English</button>
          </div>
        </section>

        <section class="panel">
          <div class="panel-title" style="margin-bottom:8px;"><span style="color:#9B72CB">${ICON.spark}</span> Google Gemini API</div>
          <label class="field-label">API Key</label>
          <input type="password" id="geminiApiKeyInput" value="${esc(currentKey)}" class="modal-input" placeholder="AIza…" autocomplete="off">
          <label class="field-label">Model</label>
          <input id="geminiModelInput" value="${esc(getStoredModel())}" class="modal-input" placeholder="${DEFAULT_MODEL}">
          <div class="row gap8 wrap">
            <button class="btn btn-filled sm" onclick="saveGeminiApiKey()">${t('saveSettings')}</button>
            ${currentKey ? `<button class="btn btn-danger-text sm" onclick="localStorage.removeItem('mindnote_gemini_api_key'); renderCurrentView();">${t('clearKey')}</button>` : ''}
            <span class="cat-badge ${currentKey ? 'cat-memo' : ''}" style="margin-left:auto;">${currentKey ? '<span class="laser-dot"></span>' : ''}<span>${currentKey ? t('aiActive') : t('aiOffline')}</span></span>
          </div>
        </section>

        <section class="panel">
          <div class="panel-title" style="margin-bottom:12px;">${ICON.database}<span>${t('backupTitle')}</span></div>
          <div class="row gap8 wrap">
            <button class="btn btn-tonal sm" onclick="exportJsonBackup()">${t('exportJson')}</button>
            <button class="btn btn-outlined sm" onclick="$('importFileInput').click()">${t('importJson')}</button>
            <input type="file" id="importFileInput" accept="application/json,.json" style="display:none;" onchange="importJsonBackup(event)">
            <button class="btn btn-danger-text sm" onclick="resetToDefaults()">${t('resetDemo')}</button>
          </div>
        </section>`;
    }

    function saveGeminiApiKey() {
      const val = $('geminiApiKeyInput').value.trim(), model = $('geminiModelInput').value.trim() || DEFAULT_MODEL;
      val ? localStorage.setItem('mindnote_gemini_api_key', val) : localStorage.removeItem('mindnote_gemini_api_key');
      localStorage.setItem('mindnote_gemini_model', model);
      showToast(`✨ Saved (${model})`); renderCurrentView();
    }
    function exportJsonBackup() {
      const blob = new Blob([JSON.stringify({ notes: notes.filter(n => !n.isOptimistic), exportedAt: new Date().toISOString() }, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = `MindNote_${todayStr()}.json`; a.click(); URL.revokeObjectURL(url);
    }
    function importJsonBackup(e) {
      const file = e.target.files[0]; if (!file) return;
      const r = new FileReader();
      r.onload = ev => {
        try {
          const d = JSON.parse(ev.target.result);
          if (Array.isArray(d.notes)) {
            notes = d.notes.filter(n => n && !n.isOptimistic).map(normalizeNote);
            saveState();
            showToast('✅ Imported');
          }
        } catch (err) { showToast('⚠️ Invalid JSON'); }
        e.target.value = '';
      };
      r.readAsText(file);
    }
    async function resetToDefaults() {
      if (!(await askConfirm(t('resetDemo'), t('resetDemo') + '?'))) return;
      notes = cloneDefaults(); saveState();
    }

    // ==========================================
    // 9. Modals & Direct Inline Step Editing
    // ==========================================
    function openModal(id) { $(id).classList.add('open'); document.body.style.overflow = 'hidden'; }
    function closeModal(id) { $(id).classList.remove('open'); if (!document.querySelector('.modal-overlay.open')) document.body.style.overflow = ''; }

    function openLightboxModal(id) {
      const note = notes.find(n => n.id === id);
      if (!note || note.isOptimistic) return;
      if (copilotState?.noteId !== id) copilotState = null;

      $('lightboxTitle').textContent = note.title;
      $('lightboxBadge').innerHTML = `<div class="row gap8 wrap">${catChip(note.type, true)}${note.dueDate ? '<span class="meta-sep">·</span>' : ''}${getDueBadgeHtml(note.dueDate)}</div>`;
      $('lightboxContentBox').innerHTML = (note.content && note.content !== note.title) ? `<div class="callout neutral">${esc(note.content)}</div>` : '';
      $('lightboxReasonBox').innerHTML = note.reason ? `<div class="callout purple"><div class="callout-title">${ICON.bulb}<span>${t('formReasonLbl')}</span></div><div>${esc(note.reason)}</div></div>` : '';

      renderLightboxCopilot();
      const steps = note.steps || [];
      const done = steps.filter(s => s.completed).length;
      $('lightboxStepsBox').innerHTML = `
        <div class="cat-${note.type}">
          <div class="progress-label" style="font-size:13px; color:var(--on-surface); font-weight:700;">
            <span>${t('stepProgress')}</span><span>${done}/${steps.length}</span>
          </div>
          ${steps.length ? `<div class="progress" style="margin-bottom:10px;"><i style="width:${Math.round(done / steps.length * 100)}%"></i></div>` : ''}
          <div class="list" style="margin-bottom:10px;">
            ${steps.map(s => `
              <div class="step-row ${s.completed ? 'done' : ''}">
                <label class="round-check"><input type="checkbox" ${s.completed ? 'checked' : ''} onchange="toggleStepItem('${esc(note.id)}','${esc(s.id)}')"><span></span></label>
                <input class="step-edit-input" value="${esc(s.text)}" onchange="updateStepText('${esc(note.id)}','${esc(s.id)}',this.value)">
                <button class="icon-btn sm" title="AI 拆小" onclick="openAiStepCopilot('${esc(note.id)}','${esc(s.id)}')">${ICON.wand}</button>
                <button class="icon-btn sm" onclick="deleteStepItem('${esc(note.id)}','${esc(s.id)}')">✕</button>
              </div>`).join('')}
          </div>
          <input class="modal-input" style="margin:0; height:38px; font-size:13px;" placeholder="${t('addStepPh')}"
                 onkeydown="if(event.key==='Enter' && !event.isComposing && this.value.trim()){ addManualStep('${esc(note.id)}', this.value.trim()); this.value=''; }">
        </div>`;

      $('lightboxSprintBtn').innerHTML = `${ICON.timer}<span>${t('sprint15')}</span>`;
      $('lightboxSprintBtn').onclick = () => { closeLightboxModal(); openSprintModal(note.id); };
      $('lightboxAiStepBtn').innerHTML = `${ICON.spark}<span>${t('aiStepsBtn')}</span>`;
      $('lightboxAiStepBtn').onclick = () => openAiStepCopilot(note.id, null);
      $('lightboxEditBtn').textContent = t('edit');
      $('lightboxEditBtn').onclick = () => { closeLightboxModal(); openEditModal(note.id); };
      $('lightboxDeleteBtn').textContent = t('del');
      $('lightboxDeleteBtn').onclick = () => deleteNote(note.id);
      openModal('lightboxModal');
    }
    function closeLightboxModal() { copilotState = null; closeModal('lightboxModal'); }

    function toggleStepItem(noteId, stepId) {
      let allDone = false;
      notes = notes.map(n => {
        if (n.id !== noteId) return n;
        const steps = n.steps.map(s => s.id === stepId ? { ...s, completed: !s.completed } : s);
        allDone = steps.length > 0 && steps.every(s => s.completed) && !n.completed;
        return { ...n, steps };
      });
      haptic(8); playTickChime(); saveState(); openLightboxModal(noteId);
      if (allDone) { burst(); playSuccessChime(); }
    }
    function updateStepText(noteId, stepId, text) {
      notes = notes.map(n => n.id !== noteId ? n : { ...n, steps: n.steps.map(s => s.id === stepId ? { ...s, text: text.trim() || s.text } : s) });
      saveState();
    }
    function deleteStepItem(noteId, stepId) {
      notes = notes.map(n => n.id !== noteId ? n : { ...n, steps: n.steps.filter(s => s.id !== stepId) });
      saveState(); openLightboxModal(noteId);
    }
    function addManualStep(noteId, text) {
      notes = notes.map(n => n.id !== noteId ? n : { ...n, steps: [...(n.steps || []), { id: uid('s'), text, completed: false }] });
      saveState(); openLightboxModal(noteId);
    }

    // Create / Edit Modal
    let modalCategory = 'academic';
    function openNewModal(dateStr) {
      editingNoteId = null; $('modalFormHeading').textContent = t('formNew');
      ['aiModalPromptInput', 'formTitle', 'formContent', 'formReason', 'formSteps', 'formTags'].forEach(id => $(id).value = '');
      $('formDueDate').value = typeof dateStr === 'string' ? dateStr : todayStr();
      setModalCategory(currentTab === 'memo' ? 'memo' : 'academic');
      openModal('createModal'); setTimeout(() => $('formTitle').focus(), 200);
    }
    function openEditModal(id) {
      const n = notes.find(x => x.id === id); if (!n) return;
      editingNoteId = id; $('modalFormHeading').textContent = t('formEdit');
      $('aiModalPromptInput').value = ''; $('formTitle').value = n.title; $('formContent').value = n.content || '';
      $('formReason').value = n.reason || ''; $('formSteps').value = (n.steps || []).map(s => s.text).join('\n');
      $('formDueDate').value = n.dueDate || ''; $('formTags').value = (n.tags || []).join(' ');
      setModalCategory(n.type); openModal('createModal');
    }
    function openNewModalWithType(type) { openNewModal(); setModalCategory(type); }
    function openNewModalWithDraft() {
      const d = $('quickPromptInput').value.trim(); openNewModal();
      $('aiModalPromptInput').value = d; $('formTitle').value = d;
      if (quickSelectedType !== 'auto') setModalCategory(quickSelectedType);
    }
    function closeNewModal() { closeModal('createModal'); }
    function setModalCategory(type) { modalCategory = type; ['academic', 'memo'].forEach(x => $(`modalType-${x}`).classList.toggle('selected', x === type)); }

    async function fillModalViaAi() {
      const val = $('aiModalPromptInput').value.trim(); if (!val) return;
      const btn = $('aiFillBtn'), orig = btn.innerHTML;
      btn.disabled = true; btn.innerHTML = `${ICON.spinner}<span>${t('thinking')}</span>`;
      try {
        const p = await smartPlanTask(val, true);
        setModalCategory(p.type); $('formTitle').value = p.title; $('formContent').value = p.content;
        $('formReason').value = p.reason; $('formDueDate').value = p.dueDate || todayStr();
        $('formTags').value = (p.tags || []).join(' '); $('formSteps').value = (p.steps || []).map(s => s.text).join('\n');
        playTickChime();
      } finally { btn.disabled = false; btn.innerHTML = orig; }
    }

    function saveNoteForm() {
      const title = $('formTitle').value.trim(); if (!title) { $('formTitle').focus(); return; }
      let content = $('formContent').value.trim(); if (content === title) content = '';
      const reason = $('formReason').value.trim(), dueDate = $('formDueDate').value;
      const tags = $('formTags').value.trim().split(/[\s,，]+/).filter(Boolean).map(x => x.startsWith('#') ? x : '#' + x);
      const stepLines = $('formSteps').value.split('\n').map(s => s.trim()).filter(Boolean);

      if (editingNoteId) {
        notes = notes.map(n => {
          if (n.id !== editingNoteId) return n;
          const old = n.steps || [];
          const steps = stepLines.map(text => old.find(s => s.text === text) || { id: uid('s'), text, completed: false });
          return { ...n, type: modalCategory, title, content, reason, dueDate, tags, steps };
        });
      } else {
        notes.unshift({ id: uid('note'), type: modalCategory, title, content, reason, createdAt: new Date().toISOString(), dueDate, starred: false, completed: false, tags, steps: stepLines.map(text => ({ id: uid('s'), text, completed: false })) });
      }
      saveState(); closeNewModal(); playTickChime();
    }

    function toggleNoteComplete(id) {
      const n = notes.find(x => x.id === id); if (!n) return;
      const nowDone = !n.completed, pos = { ...lastPointer };
      notes = notes.map(x => x.id === id ? { ...x, completed: nowDone } : x);
      if (nowDone && aiPickResult?.id === id) aiPickResult = null;
      haptic(nowDone ? 18 : 8);
      if (nowDone) { burst(pos.x, pos.y); playSuccessChime(); showToast(`🎉 ${n.title}`); }
      setTimeout(saveState, nowDone ? 160 : 0);
    }
    function toggleStar(id) { notes = notes.map(n => n.id === id ? { ...n, starred: !n.starred } : n); haptic(6); saveState(); }

    // 15-Minute Sprint Timer
    const RING_C = 552.92;
    let sprintSeconds = 900, sprintTotal = 900, sprintTimerInterval = null, sprintRunning = false, currentSprintNoteId = null;
    function openSprintModal(id) {
      const n = notes.find(x => x.id === id); currentSprintNoteId = id;
      $('sprintTaskTitle').textContent = n ? n.title : t('sprint15');
      sprintSeconds = sprintTotal = 900; updateSprintDisplay(); openModal('sprintModal'); startSprintTimer();
    }
    function closeSprintModal() { clearInterval(sprintTimerInterval); sprintRunning = false; $('sprintRingWrap').classList.remove('running'); closeModal('sprintModal'); }
    function updateSprintDisplay() {
      $('sprintTimerDisplay').textContent = `${pad(Math.floor(sprintSeconds / 60))}:${pad(sprintSeconds % 60)}`;
      $('sprintRing').style.strokeDashoffset = RING_C * (1 - sprintSeconds / sprintTotal);
      $('sprintSub').textContent = sprintSeconds === 0 ? t('sprintSubDone') : sprintRunning ? t('sprintSubRun') : t('sprintSubPause');
    }
    function toggleSprintTimer() {
      if (sprintSeconds === 0) { const n = notes.find(x => x.id === currentSprintNoteId); if (n && !n.completed) toggleNoteComplete(currentSprintNoteId); closeSprintModal(); return; }
      if (sprintRunning) { clearInterval(sprintTimerInterval); sprintRunning = false; $('sprintRingWrap').classList.remove('running'); $('sprintToggleBtn').textContent = t('sprintResume'); updateSprintDisplay(); }
      else startSprintTimer();
    }
    function startSprintTimer() {
      clearInterval(sprintTimerInterval); sprintRunning = true;
      $('sprintRingWrap').classList.add('running'); $('sprintToggleBtn').textContent = t('sprintPause'); updateSprintDisplay();
      sprintTimerInterval = setInterval(() => {
        if (sprintSeconds > 0) { sprintSeconds--; updateSprintDisplay(); }
        if (sprintSeconds === 0) {
          clearInterval(sprintTimerInterval); sprintRunning = false; $('sprintRingWrap').classList.remove('running');
          playSuccessChime(); burst(); $('sprintToggleBtn').textContent = t('sprintMarkDone'); updateSprintDisplay();
        }
      }, 1000);
    }
    function resetSprintTimer() { clearInterval(sprintTimerInterval); sprintRunning = false; $('sprintRingWrap').classList.remove('running'); sprintSeconds = sprintTotal = 900; updateSprintDisplay(); $('sprintToggleBtn').textContent = t('sprintStart'); }
    function add5MinSprint() { sprintSeconds += 300; sprintTotal += 300; updateSprintDisplay(); }

    // Keyboard shortcuts
    window.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        if ($('confirmModal').classList.contains('open')) { resolveConfirm(false); return; }
        ['lightboxModal', 'createModal', 'sprintModal'].forEach(id => {
          if ($(id).classList.contains('open')) {
            if (id === 'sprintModal') closeSprintModal();
            else if (id === 'lightboxModal') closeLightboxModal();
            else closeModal(id);
          }
        });
        return;
      }
      if (/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName) || e.ctrlKey || e.metaKey || e.altKey || document.querySelector('.modal-overlay.open')) return;
      if (e.key === '/') { e.preventDefault(); $('quickPromptInput').focus(); }
      else if (e.key.toLowerCase() === 'n') { e.preventDefault(); openNewModal(); }
    });

    // Boot & Liquid-Mercury Nav Indicator Sync
    function boot() {
      document.body.dataset.tab = currentTab;
      applyStaticI18n();
      renderCurrentView();
      requestAnimationFrame(() => updateNavIndicator(true));
      if (window.ResizeObserver && $('navRail')) {
        new ResizeObserver(() => updateNavIndicator(true)).observe($('navRail'));
      }
      window.addEventListener('resize', () => updateNavIndicator(true));
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => updateNavIndicator(true));
      }
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot); else boot();
  </script>
</body>
</html>
